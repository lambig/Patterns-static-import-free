plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'io.github.lambig'
archivesBaseName = 'Patterns-static-import-free'
version = '1.2.1'

sourceCompatibility = 1.8

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    api group: 'io.github.lambig', name: 'functional-interface-extension', version: '1.1.1'
    api group: 'io.github.lambig', name: 'Tuplite', version: '1.0.0'

    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.6.2'
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.6.2'
    testImplementation group: 'org.assertj', name: 'assertj-core', version: '3.27.7'
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
}

tasks.withType(JavaCompile){
    options.encoding = "UTF-8"
}

java {
    withJavadocJar()
    withSourcesJar()
}

test {
    useJUnitPlatform()
    test.outputs.upToDateWhen {false}
}


publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = archivesBaseName
            from components.java
            pom {
                name = 'Patterns-static-import-free'
                description = 'easy pattern matching implementation'
                url = 'https://github.com/lambig/Patterns-static-import-free'
                licenses { license { name = 'MIT License'; url = 'https://opensource.org/licenses/MIT' } }
                developers { developer { id = 'lambig'; name = 'lambig' } }
                scm { url = 'https://github.com/lambig/Patterns-static-import-free' }
            }
        }
    }
}

signing {
    required {
        gradle.taskGraph.allTasks.any {
            it instanceof org.gradle.api.publish.maven.tasks.PublishToMavenRepository
        }
    }
    sign publishing.publications.mavenJava
}
